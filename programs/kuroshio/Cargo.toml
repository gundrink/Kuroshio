[package]
name = "kuroshio"
version = "0.1.0"
description = "Shared stablecoin book on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kuroshio"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
kuroshio-math = { path = "../../crates/kuroshio-math" }
# 1.8 pulls digest 0.11, which the Solana 1.75 BPF compiler cannot build.
blake3 = "=1.5.5"
